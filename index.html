<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DonutSMP Network</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

header {
    padding: 50px 20px;
}

h1 {
    font-size: 45px;
    color: #f5c542;
}

p {
    color: #ccc;
    font-size: 18px;
}

.container {
    max-width: 600px;
    margin: auto;
}

.box {
    background: #1c1c1c;
    padding: 25px;
    margin: 20px;
    border-radius: 10px;
}

.ip {
    background: #000;
    padding: 15px;
    margin: 15px 0;
    color: #00ff88;
    font-size: 20px;
    border-radius: 5px;
}

.button {
    display: inline-block;
    padding: 12px 25px;
    background: #f5c542;
    color: black;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

.button:hover {
    background: white;
}

footer {
    margin-top: 40px;
    padding: 20px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>DonutSMP</h1>
    <p>Minecraft Survival Multiplayer Server</p>
</header>

<div class="container">

<div class="box">
    <h2>Server IP</h2>
    <div class="ip">
        play.donutsmp.surckre.org
    </div>
    <p>Java Edition</p>
</div>

<div class="box">
    <h2>About</h2>
    <p>
        Welcome to DonutSMP. 
        Build, survive, and play with the community.
    </p>
</div>

<div class="box">
    <h2>Community</h2>
    <a class="button" href="#">
        Discord
    </a>
</div>

</div>

<footer>
    © 2026 DonutSMP Network
</footer>

</body>
</html>
